<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0d2235">
  <title>RS485 CH1/CH2/CH3 实时监控</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <button id="menuButton" class="icon-button" aria-label="打开导航" aria-expanded="true">☰</button>
    <strong id="pageTitle">实时监控</strong>
    <span id="liveBadge" class="live-badge">等待实时数据</span>
    <button id="configButton" class="config-button" type="button">配置数据源</button>
  </header>

  <div class="layout">
    <aside id="sidebar" class="sidebar">
      <button class="nav-link active" data-page="monitor">实时监控</button>
      <button class="nav-link" data-page="records">RS485数据记录</button>
    </aside>

    <main class="main">
      <section id="monitorPage" class="page active">
        <article class="card overview-card">
          <div class="section-head"><div><h1>RS485 三路电压</h1><p>数据源：DAM5x03D · CH1 / CH2 / CH3</p></div><span id="dataState" class="data-state">等待采样</span></div>
          <div class="channel-grid">
            <div class="channel-card"><div class="channel-name">CH1</div><svg class="gauge" viewBox="0 0 300 175" aria-label="CH1电压仪表盘"><path class="gauge-track" d="M35 145 A115 115 0 0 1 265 145"/><path id="CH1Gauge" class="gauge-value ch1" d="M35 145 A115 115 0 0 1 265 145"/><text x="35" y="164" class="gauge-limit">0</text><text x="250" y="164" class="gauge-limit">17</text><text id="CH1Value" x="150" y="121" class="gauge-number">--</text><text x="150" y="145" class="gauge-unit">V</text></svg></div>
            <div class="channel-card"><div class="channel-name">CH2</div><svg class="gauge" viewBox="0 0 300 175" aria-label="CH2电压仪表盘"><path class="gauge-track" d="M35 145 A115 115 0 0 1 265 145"/><path id="CH2Gauge" class="gauge-value ch2" d="M35 145 A115 115 0 0 1 265 145"/><text x="35" y="164" class="gauge-limit">0</text><text x="250" y="164" class="gauge-limit">17</text><text id="CH2Value" x="150" y="121" class="gauge-number">--</text><text x="150" y="145" class="gauge-unit">V</text></svg></div>
            <div class="channel-card"><div class="channel-name">CH3</div><svg class="gauge" viewBox="0 0 300 175" aria-label="CH3电压仪表盘"><path class="gauge-track" d="M35 145 A115 115 0 0 1 265 145"/><path id="CH3Gauge" class="gauge-value ch3" d="M35 145 A115 115 0 0 1 265 145"/><text x="35" y="164" class="gauge-limit">0</text><text x="250" y="164" class="gauge-limit">17</text><text id="CH3Value" x="150" y="121" class="gauge-number">--</text><text x="150" y="145" class="gauge-unit">V</text></svg></div>
          </div>
          <div class="summary-grid">
            <div class="metric time-metric"><span>北京时间</span><strong id="beijingTime">--</strong></div>
            <div class="metric status-metric"><span>当前状态</span><strong id="statusText">--</strong></div>
            <div class="metric cycle-metric"><span>循环次数</span><strong id="cycleCount">--</strong></div>
          </div>
        </article>

        <article class="card chart-card">
          <div class="chart-head"><div><h1>三路电压曲线</h1><p>CH1 / CH2 / CH3 · 将鼠标移到采样点查看三路数值 · 滚轮缩放 · 双击复位</p></div><button id="resetZoom" class="action-button">复位</button></div>
          <div class="chart-legend"><span><i class="legend-ch1"></i>CH1</span><span><i class="legend-ch2"></i>CH2</span><span><i class="legend-ch3"></i>CH3</span></div>
          <div id="chartWrap" class="chart-wrap"><svg id="chart" viewBox="0 0 1000 410" preserveAspectRatio="none" aria-label="CH1、CH2、CH3可缩放电压曲线"></svg><div id="tooltip" class="tooltip" hidden></div></div>
        </article>
      </section>

      <section id="recordsPage" class="page">
        <article class="card records-card">
          <div class="records-head"><div><h1>RS485采样数据</h1><p>最近720条 CH1 / CH2 / CH3 真实采样记录</p></div><input id="searchInput" type="search" placeholder="搜索记录" aria-label="搜索记录"></div>
          <div class="table-wrap"><table><thead><tr><th>采样时间</th><th>CH1(V)</th><th>CH2(V)</th><th>CH3(V)</th><th>当前状态</th><th>循环次数</th></tr></thead><tbody id="recordsBody"></tbody></table></div>
        </article>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
